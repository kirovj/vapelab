# 雾室 vapelab Nginx 配置

server {
    listen 80;
    server_name _;  # 替换为你的域名

    # 前端静态文件
    location / {
        root /var/www/vapelab/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件
    location /static/ {
        alias /var/www/vapelab/backend/static/;
    }

    # 日志
    access_log /var/log/nginx/vapelab-access.log;
    error_log /var/log/nginx/vapelab-error.log;
}
